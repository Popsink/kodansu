# Which copyright notice each tracked `*.rs` file must open with.
#
# Checked by `.github/scripts/check-copyright.py`, run as the `copyright` job in
# `.github/workflows/pr.yml` and by `just copyright`. See `docs/copyright.md` for
# the policy and for how the classification below was derived.
#
# The default is Popsink's notice: a file listed in neither array under `[files]`
# must open with it. That is deliberate — a new file added by copy-pasting an
# existing one inherits the wrong header, and defaulting to Popsink is what makes
# CI catch that instead of waving it through.

[notice]
# Popsink-authored files. Every commit at Popsink is dated 2026 (the fork point
# is 2026-05-16), so the notice claims 2026 alone.
popsink = "// Copyright ⓒ 2026 Popsink SAS"

# Files derived from tansu keep upstream's notice byte-for-byte, per
# Apache-2.0 §4(c). Both year ranges occur upstream and neither is ours to
# renumber, so both are accepted wherever `files.inherited` applies.
upstream = [
    "// Copyright ⓒ 2024-2025 Peter Morgan <peter.james.morgan@gmail.com>",
    "// Copyright ⓒ 2024-2026 Peter Morgan <peter.james.morgan@gmail.com>",
]

[blame]
# Measured by `.github/scripts/defork-report.py` (`just defork-report`, and
# `just defork-check` in CI). A line `git blame` attributes to `fork_point` or
# an ancestor of it, or to one of `ports`, is upstream's. See docs/copyright.md.
#
# The merge-base of Popsink's main and tansu-io/main, as derived under
# "Reproducing the classification" in docs/copyright.md.
fork_point = "ae28fa7e4659ce19772e1c17aad21e33615e61a8"
# Post-fork commits that brought upstream code in. Blame calls their lines new,
# so they have to be named: 27df1fb is the tansu-io#680 consumer-group port. The
# epic (Popsink/data-plane#5878) stopped ports, so this list only shrinks.
ports = [
    "27df1fbd36dc32365e33d999b3e17596c34c7036",
]

[files]
# Files derived from tansu: they carry an `upstream` notice and nothing else.
#
# This list is closed to new code: it shrinks when an inherited file is deleted
# and an entry is edited when one is moved, but it never grows on its own. The
# eighteen `dynostore/` modules are the one move it has recorded so far: #550
# cut `dynostore.rs` into them without writing a line, so each is a destination
# of an entry that was already here, not upstream code arriving. Nine of them
# have since left: `just defork-report` found no upstream line in them, even
# following the moves (Popsink/data-plane#5879).
# Upstream code can only enter the tree through a deliberate port, and adding a
# line here is the reviewable act that records one. (Nine of these arrived that way already, via
# 27df1fb porting tansu-io#680; they are new files by tree comparison but
# upstream-authored, which is why classification keys off the authorship of the
# commit that added a file, never off `git diff --diff-filter=A` alone.)
