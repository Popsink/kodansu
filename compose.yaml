---
services:
  grafana:
    image: grafana/grafana:11.5.1
    ports:
      - 3000:3000
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: true
      GF_AUTH_ANONYMOUS_HIDE_VERSION: true
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: true
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/dashboards/home.json
      GF_LIVE_ALLOWED_ORIGINS: "https://*.preview.app.github.dev"
    volumes:
      - type: bind
        source: etc/grafana/provisioning
        target: /etc/grafana/provisioning
      - type: bind
        source: etc/grafana/dashboards
        target: /etc/dashboards
      - grafana:/var/lib/grafana
    pull_policy: missing
  minio:
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    volumes:
      - minio:/data
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_PROMETHEUS_AUTH_TYPE: public
    healthcheck:
      test: timeout 5s bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1
      interval: 5s
      retries: 1
      start_period: 5s
      timeout: 5s
  # Microsoft's own Blob emulator (#420). Blob only — `azurite-blob` rather than
  # `azurite` — because the queue and table services are 10001/10002 and nothing
  # here speaks either.
  #
  # No `--skipApiVersionCheck`: `object_store` pins `x-ms-version: 2023-11-03`
  # (`azure/credential.rs:49`) and this image accepts it, which was worth
  # confirming rather than assuming — the flag would have hidden a real
  # incompatibility behind a green run.
  #
  # What a green run here does NOT prove is in `docs/testing.md`, next to the
  # job. Three things, and the sharp one is that `object_store` detects the
  # emulator and bypasses `startFrom` entirely.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --location /data
    volumes:
      - azurite:/data
    ports:
      - 10000:10000
    healthcheck:
      # The image is Alpine with no bash, so not minio's `/dev/tcp` idiom.
      test: nc -z 127.0.0.1 10000 || exit 1
      interval: 5s
      retries: 3
      start_period: 5s
      timeout: 5s
  tansu:
    image: ${TANSU_IMAGE}
    restart: unless-stopped
    environment:
      RUST_BACKTRACE: ${RUST_BACKTRACE}
      RUST_LOG: ${RUST_LOG}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_ENDPOINT: ${AWS_ENDPOINT}
      AWS_ALLOW_HTTP: ${AWS_ALLOW_HTTP}
    volumes:
      - ./data:/data/
    command: |
      --kafka-cluster-id ${CLUSTER_ID}
      --kafka-listener-url tcp://0.0.0.0:9092/
      --kafka-advertised-listener-url ${ADVERTISED_LISTENER_URL}
      --storage-engine ${STORAGE_ENGINE}
    ports:
      - 9092:9092
  jaeger:
    image: jaegertracing/all-in-one
    ports:
      - 16686:16686
      - 4317:4317
      - 4318:4318
      - 5778:5778
      - 9411:9411
  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - 9090:9090
    command: --web.enable-otlp-receiver
    configs:
      - source: prometheus_yaml
        target: /prometheus/prometheus.yml
configs:
  prometheus_yaml:
    file: etc/prometheus.yaml
volumes:
  minio:
    driver: local
  azurite:
    driver: local
  grafana:
    driver: local
