# Overlay for the EKS preprod sandbox (context
# eks-mb-sandbox-tsop.zonkey-royal.ts.net).
#
#   kubectl --context eks-mb-sandbox-tsop.zonkey-royal.ts.net apply -k deploy/k8s/eks-mb-sandbox
#
# Deploys INTO the existing tansu-external namespace and reuses its
# `tansu-external` ServiceAccount, so the pods inherit its EKS Pod Identity
# association (S3 access to the bucket) with no new IAM. Resource names
# (tansu-coordinator, tansu-proxy, tansu-object-store) are distinct from the
# live tansu-external workload and carry no ArgoCD tracking id, so ArgoCD
# (prune+selfHeal) leaves them alone.
#
# Data is isolated by a DEDICATED cluster id `m2coord` (its own
# clusters/m2coord/ prefix in the SAME bucket — disjoint from tansu-external +
# Kotatsu's `tansu` cluster).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tansu-external

resources:
  - ../base

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: tansu-object-store
    literals:
      - BUCKET=eks-mb-sandbox-tansu-917630917049
      - AWS_DEFAULT_REGION=eu-west-3
      - AWS_ENDPOINT_URL=https://s3.eu-west-3.amazonaws.com

images:
  - name: ghcr.io/tansu-io/tansu
    newName: ghcr.io/popsink/tansu
    newTag: 0.8.0-alpha.2

patches:
  - path: patch-coordinator.yaml
    target:
      kind: StatefulSet
      name: tansu-coordinator
  - path: patch-proxy.yaml
    target:
      kind: Deployment
      name: tansu-proxy
