# Object-store credentials shared by the coordinator and the proxies.
# EXAMPLE ONLY — replace with real credentials (or a sealed/external secret) and
# do not commit secrets. Both workloads read these as S3 credentials from the
# environment (the same way `s3://` storage does today).
apiVersion: v1
kind: Secret
metadata:
  name: tansu-object-store-credentials
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
