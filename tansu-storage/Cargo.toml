[package]
name = "tansu-storage"
description = "Object-store (S3, GCS or memory) storage abstraction for Tansu"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
include.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[features]
default = ["dynostore"]
dynostore = ["dep:object_store"]

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
cached.workspace = true
console.workspace = true
chrono.workspace = true
futures-core.workspace = true
futures-util.workspace = true
futures.workspace = true
governor.workspace = true
human-units.workspace = true
indicatif.workspace = true
object_store = { workspace = true, optional = true }
opentelemetry-semantic-conventions.workspace = true
opentelemetry.workspace = true
rama.workspace = true
rand.workspace = true
rsasl.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tansu-sans-io.workspace = true
thiserror.workspace = true
tokio-util.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]

# The scaling signal (#362) is an up-down counter, and a counter of that shape
# fails by leaking rather than by being wrong: the test has to read it back.
opentelemetry_sdk = { workspace = true, features = ["testing"] }

assert_matches.workspace = true
criterion.workspace = true
dotenv.workspace = true
# Only to *build* a linked-block LZ4 frame in the #253 repair test: the corrected
# encoder cannot produce one, so the damage has to be constructed by hand.
lz4.workspace = true
pretty_assertions.workspace = true
tempfile.workspace = true
time.workspace = true
tracing-subscriber.workspace = true
