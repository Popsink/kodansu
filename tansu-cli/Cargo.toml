[package]
name = "tansu-cli"
description = "Tansu CLI"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
include.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = []
# Forwards, rather than being a bare marker: the `audit` subcommand is
# `tansu-storage`'s object-store audit, so enabling this feature here without
# enabling it there leaves the subcommand referring to types that are not built.
dynostore = ["tansu-broker/dynostore", "tansu-storage/dynostore"]

[dependencies]
bytes.workspace = true
clap.workspace = true
dotenv.workspace = true
humantime.workspace = true
owo-colors.workspace = true
