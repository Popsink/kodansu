# nextest configuration.
#
# The default profile is deliberately left alone: it is what `just test` uses on
# a developer machine, where a contended laptop inflates wall-clock across the
# board (a pure codec round-trip once measured 179s under parallel cargo jobs,
# #256) and a timeout would fire on contention rather than on a real problem.

# CI profile (#256). Selected by `NEXTEST_PROFILE=ci` in the workflows, not by
# the justfile, so local runs keep the defaults above.
#
# Purpose: attribute the job's test time. The `test` job spends ~10 minutes in
# nextest execution and today no run says which tests those minutes belong to —
# the log is truncated before the summary and no SLOW line is ever emitted.
[profile.ci]
# Name every test over 30s, on every run. No `terminal-after` yet: the point of
# this profile is to learn what is legitimately slow before deciding what to cap,
# and a kill switch chosen from laptop measurements would turn an
# unknown-but-honest duration into a red build. Add it once the names and their
# real CI durations are known (#256 step 4).
slow-timeout = { period = "30s" }

# Print slow and failing tests, not the thousands of passing ones. This is also
# what stops the log being truncated before nextest's own summary — the summary
# is the part that carries the timings.
status-level = "slow"
final-status-level = "slow"

# Failures immediately (so a red run is diagnosable while it is still running)
# and again at the end, so they are not buried mid-log.
failure-output = "immediate-final"
